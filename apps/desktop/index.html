<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/pinax.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pinax Desktop</title>
    <style>
      html, body, #root { height: 100%; margin: 0; }
      body { background: #ffffff; }
      html.dark body { background: #0a0a0a; }

      #app-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.25rem;
        z-index: 9999;
        background: #ffffff;
        color: #0a0a0a;
        transition: opacity 250ms ease, visibility 250ms ease;
      }
      html.dark #app-loader {
        background: #0a0a0a;
        color: #fafafa;
      }
      #app-loader.is-hidden {
        opacity: 0;
        visibility: hidden;
      }
      .loader-logo {
        width: 88px;
        height: 88px;
        border-radius: 18px;
        background: #000000;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 12px 40px -12px rgba(0, 0, 0, 0.4);
      }
      html.dark .loader-logo {
        background: #fafafa;
        box-shadow: 0 12px 40px -12px rgba(255, 255, 255, 0.15);
      }
      .loader-logo svg {
        width: 52px;
        height: 52px;
        color: #ffffff;
      }
      html.dark .loader-logo svg {
        color: #0a0a0a;
      }
      .loader-spinner {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        border: 2.5px solid currentColor;
        border-right-color: transparent;
        opacity: 0.85;
        animation: loader-spin 0.9s linear infinite;
      }
      @keyframes loader-spin {
        to { transform: rotate(360deg); }
      }
      @media (prefers-reduced-motion: reduce) {
        .loader-spinner { animation-duration: 1.6s; }
      }
    </style>
  </head>
  <body>
    <div id="app-loader" aria-hidden="true">
      <div class="loader-logo">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 3v16a2 2 0 0 0 2 2h16"></path>
          <path d="M18 17V9"></path>
          <path d="M13 17V5"></path>
          <path d="M8 17v-3"></path>
        </svg>
      </div>
      <div class="loader-spinner" role="status" aria-label="Cargando"></div>
    </div>
    <div id="root"></div>
    <script>
      (function () {
        var theme = localStorage.getItem("theme")
        var systemDark = window.matchMedia("(prefers-color-scheme: dark)").matches
        var isDark = theme === "dark" || ((theme === "system" || theme === null) && systemDark)
        if (isDark) {
          document.documentElement.classList.add("dark")
        }
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
