name: Trigger RC Release

on:
  push:
    branches:
      - main

concurrency:
  group: rc-${{ github.ref }}
  cancel-in-progress: false

# contents: write = RC releases (publish job) + changesets/action pushing to
# changeset-release/main; pull-requests: write = changesets/action PR.
permissions:
  contents: write
  pull-requests: write

jobs:
  resolve:
    name: Resolve desktop matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.mtx.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve matrix
        id: mtx
        uses: ./.github/actions/resolve-desktop-matrix

  publish-rc:
    name: Build RC artifacts
    needs: resolve
    # G3': skip commits authored by changesets/action (rebase/squash merges keep
    # the "Version Packages" commit/PR title; "Release " covers legacy naming).
    if: |
      !startsWith(github.event.head_commit.message, 'Version Packages') &&
      !startsWith(github.event.head_commit.message, 'Release ')
    uses: ./.github/workflows/_build-artifacts.yaml
    with:
      ref: ${{ github.sha }}
      prerelease: rc
      packages-hint: '["pinax-desktop","pinax-landing"]'
      desktop-matrix: ${{ needs.resolve.outputs.matrix }}
    secrets: inherit

  release-rc:
    name: Publish RC releases
    needs: publish-rc
    if: needs.publish-rc.outputs.packages != '[]'
    uses: ./.github/workflows/_publish-release.yaml
    with:
      ref: ${{ github.sha }}
      packages: ${{ needs.publish-rc.outputs.packages }}
      versions-json: ${{ needs.publish-rc.outputs.versions-json }}
      notes-json: ${{ needs.publish-rc.outputs.notes-json }}
      prerelease: rc
    secrets: inherit

  create-release-pr:
    name: Create Version Packages PR
    # Same G3' guard as publish-rc: never re-run on its own merges.
    if: |
      !startsWith(github.event.head_commit.message, 'Version Packages') &&
      !startsWith(github.event.head_commit.message, 'Release ')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node + pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Create Version Packages Pull Request
        # No `title` input -> changesets/action uses its default "Version Packages".
        # The action bumps versions, updates CHANGELOGs and deletes used
        # changesets on the changeset-release/main branch, then opens/updates the
        # official release PR. Merging that PR triggers trigger-release.yaml.
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

