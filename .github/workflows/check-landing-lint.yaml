name: Check Landing Lint

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: lint-build-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-build:
    name: lint-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build desktop (compile only)
        run: pnpm --filter @pinax/desktop dist

      - name: Build landing
        run: pnpm --filter @pinax/landing build