name: Deploy Landing

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag (or exact SHA) to check out and deploy from
        required: true
        type: string

concurrency:
  group: deploy-landing-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build landing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Setup Node + pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Build landing
        run: pnpm --filter @pinax/landing build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/landing/dist/

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
