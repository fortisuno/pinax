name: Build Release Artifacts (reusable)

on:
  workflow_call:
    inputs:
      ref:
        description: Exact SHA to checkout and build from (never a branch tip)
        type: string
        required: true
      prerelease:
        description: 'Prerelease kind: "" (official), "alpha", or "rc"'
        type: string
        required: false
        default: ""
      packages-hint:
        description: 'JSON array of package nicknames the caller suspects are affected (e.g. ["pinax-desktop","pinax-landing"])'
        type: string
        required: false
        default: '["pinax-desktop","pinax-landing"]'
      desktop-matrix:
        description: 'JSON array of desktop matrix rows, e.g. [{"platform":"linux","os":"ubuntu-latest","arch":"x64"}]'
        type: string
        required: true
      short-sha:
        description: Short SHA used for the "+<sha7>" suffix of alpha versions
        type: string
        required: false
        default: ""
    outputs:
      packages:
        description: JSON array of package nicknames to release (G5-filtered)
        value: ${{ jobs.compute.outputs.packages }}
      versions-json:
        description: JSON object mapping nicknames to computed version strings
        value: ${{ jobs.compute.outputs.versions-json }}
      notes-json:
        description: JSON object mapping nicknames to markdown release notes
        value: ${{ jobs.compute.outputs.notes-json }}
      has-desktop:
        description: 'true when pinax-desktop is in the release plan'
        value: ${{ jobs.compute.outputs.has-desktop }}
      has-landing:
        description: 'true when pinax-landing is in the release plan'
        value: ${{ jobs.compute.outputs.has-landing }}
    secrets:
      CSC_LINK:
        description: Apple Developer certificate (.p12) used for notarized signing
        required: false
      CSC_KEY_PASSWORD:
        description: Password for the Apple Developer certificate
        required: false
      APPLE_ID:
        description: Apple ID used for notarization
        required: false
      APPLE_APP_SPECIFIC_PASSWORD:
        description: App-specific password used for notarization
        required: false
      APPLE_TEAM_ID:
        description: Apple Developer team ID
        required: false
      APPLE_API_KEY:
        description: Apple App Store Connect API key
        required: false
      APPLE_API_KEY_ID:
        description: Apple App Store Connect API key ID
        required: false
      APPLE_API_ISSUER:
        description: Apple App Store Connect API issuer ID
        required: false

permissions:
  contents: read

jobs:
  compute:
    name: Compute release plan
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.compute.outputs.packages }}
      versions-json: ${{ steps.compute.outputs.versions-json }}
      notes-json: ${{ steps.compute.outputs.notes-json }}
      has-desktop: ${{ steps.compute.outputs.has-desktop }}
      has-landing: ${{ steps.compute.outputs.has-landing }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Ensure base branch exists for changeset status
        if: inputs.prerelease != ''
        run: |
          git show-ref --verify refs/heads/main >/dev/null 2>&1 || git branch main origin/main
          git rev-parse --verify main >/dev/null && echo "base branch main at $(git rev-parse --short main)"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        # Only prerelease kinds need @changesets/cli; official reads package.json only.
        if: inputs.prerelease != ''
        run: pnpm install --frozen-lockfile

      - name: Compute release plan
        id: compute
        env:
          PRERELEASE: ${{ inputs.prerelease }}
          PACKAGES_HINT: ${{ inputs.packages-hint }}
          SHORT_SHA: ${{ inputs.short-sha }}
        run: |
          if [ "$PRERELEASE" != "" ]; then
            trap 'rm -f cs.tmp.json' EXIT
            pnpm exec changeset status --output=cs.tmp.json || true
          fi
          node -e "
            const fs = require('fs');
            const { execSync } = require('child_process');

            const prerelease = process.env.PRERELEASE || '';
            const hint = new Set(JSON.parse(process.env.PACKAGES_HINT || '[]'));
            const nicknames = { '@pinax/desktop': 'pinax-desktop', '@pinax/landing': 'pinax-landing' };
            const candidates = { 'pinax-desktop': './apps/desktop', 'pinax-landing': './apps/landing' };

            const packages = [];
            const versions = {};
            const notes = {};

            if (prerelease === 'alpha' || prerelease === 'rc') {
              // Central version computation: target next version from changeset
              // status, counter N from existing tags, full version per kind.
              let status = { changesets: [], releases: [] };
              if (fs.existsSync('cs.tmp.json')) {
                try { status = JSON.parse(fs.readFileSync('cs.tmp.json', 'utf8')); } catch {}
              }
              const shortSha = process.env.SHORT_SHA || '';

              for (const r of status.releases || []) {
                if (r.type === 'none') continue;
                const nick = nicknames[r.name];
                if (!nick || !hint.has(nick)) continue;
                const base = r.newVersion;

                let max = 0;
                try {
                  const tags = execSync('git tag -l \"' + nick + '@' + base + '-' + prerelease + '.*\"', { encoding: 'utf8' });
                  for (const line of tags.split('\n')) {
                    // Regex literals on purpose: string-built regexes would
                    // collapse \d / \. through JS string unescaping.
                    const match = prerelease === 'alpha'
                      ? line.match(/-alpha\.(\d+)\+/)
                      : line.match(/-rc\.(\d+)$/);
                    if (match) max = Math.max(max, Number(match[1]));
                  }
                } catch {}

                const n = max + 1;
                const full = prerelease === 'alpha'
                  ? base + '-alpha.' + n + '+' + shortSha
                  : base + '-rc.' + n;

                packages.push(nick);
                versions[nick] = full;

                const summaries = (r.changesets || []).map(id => {
                  const c = (status.changesets || []).find(x => x.id === id);
                  return c ? '- ' + c.summary : '';
                }).filter(Boolean).join('\n');

                notes[nick] = [
                  '**Bump:** ' + r.type,
                  '**Package:** \`' + r.name + '\`',
                  '**Version:** \`' + full + '\`',
                  '',
                  '### Changes',
                  summaries || '_No summary provided_'
                ].join('\n');
              }
            } else {
              // Official: versions come from the already-bumped package.json at the ref.
              for (const [pkg, dir] of Object.entries(candidates)) {
                if (!hint.has(pkg)) continue;
                if (!fs.existsSync(dir + '/package.json')) continue;

                const ver = JSON.parse(fs.readFileSync(dir + '/package.json', 'utf8')).version;
                if (ver === '0.0.0') {
                  console.log('Initial placeholder version for ' + pkg + ', nothing to release');
                  continue;
                }

                packages.push(pkg);
                versions[pkg] = ver;

                // Extract the <version> section from the package changelog (G4 notes).
                let note = 'Release ' + ver;
                try {
                  const changelog = fs.readFileSync(dir + '/CHANGELOG.md', 'utf8');
                  const marker = '## ' + ver;
                  const start = changelog.indexOf(marker);
                  if (start !== -1) {
                    const bodyStart = start + marker.length;
                    const next = changelog.indexOf('\n## ', bodyStart);
                    note = (next === -1 ? changelog.slice(bodyStart) : changelog.slice(bodyStart, next)).trim() || note;
                  }
                } catch {}
                notes[pkg] = note;
              }
            }

            // G5 (all kinds): drop packages whose release tag already exists.
            const toRelease = [];
            const filteredVersions = {};
            const filteredNotes = {};
            for (const pkg of packages) {
              const ver = versions[pkg];
              const tag = pkg + '@' + ver;
              try {
                execSync('git rev-parse -q --verify refs/tags/' + tag, { stdio: 'pipe' });
                console.log('G5 skip: tag ' + tag + ' already exists');
                continue;
              } catch {}
              toRelease.push(pkg);
              filteredVersions[pkg] = ver;
              filteredNotes[pkg] = notes[pkg] || 'Release ' + tag;
            }

            const hasDesktop = toRelease.includes('pinax-desktop');
            const hasLanding = toRelease.includes('pinax-landing');
            console.log('Release plan: ' + JSON.stringify(toRelease));
            if (toRelease.length === 0) console.log('Nothing to release');

            const append = (k, v) => fs.appendFileSync(process.env.GITHUB_OUTPUT, k + '=' + v + '\n');
            append('packages', JSON.stringify(toRelease));
            append('versions-json', JSON.stringify(filteredVersions));
            append('notes-json', JSON.stringify(filteredNotes));
            append('has-desktop', hasDesktop ? 'true' : 'false');
            append('has-landing', hasLanding ? 'true' : 'false');
          "

  build-desktop:
    name: Build desktop (${{ matrix.platform }})
    needs: compute
    if: needs.compute.outputs.has-desktop == 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.desktop-matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Get version
        id: version
        env:
          VERSIONS_JSON: ${{ needs.compute.outputs.versions-json }}
        run: |
          VERSION=$(node -p "JSON.parse(process.env.VERSIONS_JSON)['pinax-desktop']")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Clean previous release outputs
        shell: bash
        run: rm -rf release

      - name: Build installers
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.CSC_LINK == '' && 'false' || 'true' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          for v in CSC_LINK CSC_KEY_PASSWORD WIN_CSC_LINK WIN_CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER; do
            if [ -z "${!v:-}" ]; then unset "$v"; fi
          done

          pnpm --filter @pinax/desktop dist

          if [ "${{ matrix.platform }}" = "macos-intel" ]; then
            pnpm --filter @pinax/desktop exec electron-builder --mac --x64 --config.extraMetadata.version="$VERSION"
          elif [ "${{ matrix.platform }}" = "macos-arm64" ]; then
            pnpm --filter @pinax/desktop exec electron-builder --mac --arm64 --config.extraMetadata.version="$VERSION"
          elif [ "${{ matrix.platform }}" = "linux" ]; then
            pnpm --filter @pinax/desktop exec electron-builder --linux --config.extraMetadata.version="$VERSION"
          elif [ "${{ matrix.platform }}" = "windows" ]; then
            pnpm --filter @pinax/desktop exec electron-builder --win --config.extraMetadata.version="$VERSION"
          fi

      - name: Verify macOS signature
        if: startsWith(matrix.platform, 'macos-')
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -u
          OUT="release/$VERSION"
          echo "== DMG integrity =="
          shopt -s nullglob
          DMGS=("$OUT"/*.dmg)
          if [ "${#DMGS[@]}" -eq 0 ]; then
            echo "ERROR: no .dmg produced in $OUT"
            ls -la "$OUT" || true
            exit 1
          fi
          for DMG in "${DMGS[@]}"; do
            echo "--- $DMG"
            du -h "$DMG"
            shasum -a 256 "$DMG"
            hdiutil verify "$DMG"
            spctl -a -vvv --type install "$DMG" || true
          done
          echo "== .app signature =="
          APP=$(find "$OUT" -maxdepth 3 -name "*.app" | head -n 1)
          if [ -n "$APP" ]; then
            echo "APP=$APP"
            codesign --verify --deep --strict --verbose=2 "$APP" || true
            spctl --assess --verbose --type exec "$APP" || true
            xcrun stapler validate "$APP" || true
          fi

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.platform }}
          path: |
            release/${{ steps.version.outputs.version }}/pinax-*.AppImage
            release/${{ steps.version.outputs.version }}/pinax-*.zip
            release/${{ steps.version.outputs.version }}/pinax-*.dmg
            release/${{ steps.version.outputs.version }}/pinax-*-Setup.exe
          if-no-files-found: error

  build-landing:
    name: Build landing
    needs: compute
    if: needs.compute.outputs.has-landing == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Get version
        id: version
        env:
          VERSIONS_JSON: ${{ needs.compute.outputs.versions-json }}
        run: |
          VERSION=$(node -p "JSON.parse(process.env.VERSIONS_JSON)['pinax-landing']")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build landing
        run: pnpm --filter @pinax/landing build

      - name: Create landing zip
        run: |
          cd apps/landing/dist
          zip -qr "$GITHUB_WORKSPACE/pinax-landing-${{ steps.version.outputs.version }}.zip" .

      - name: Upload landing zip
        uses: actions/upload-artifact@v4
        with:
          name: landing-zip
          path: pinax-landing-${{ steps.version.outputs.version }}.zip
          if-no-files-found: error