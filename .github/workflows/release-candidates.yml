name: Release Candidates

on:
  push:
    branches:
      - main

concurrency:
  group: rc-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prepare:
    name: Compute release candidates
    runs-on: ubuntu-latest
    # Transition 5/6 (G3'): skip commits authored by changesets/action.
    if: |
      !startsWith(github.event.head_commit.message, 'Version Packages') &&
      !startsWith(github.event.head_commit.message, 'Release ')
    outputs:
      packages: ${{ steps.compute.outputs.packages }}
      versions-json: ${{ steps.compute.outputs.versions-json }}
      notes-json: ${{ steps.compute.outputs.notes-json }}
      has-desktop: ${{ steps.compute.outputs.has-desktop }}
      has-landing: ${{ steps.compute.outputs.has-landing }}
      desktop-matrix: ${{ steps.compute.outputs.desktop-matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compute affected packages and rc versions
        id: compute
        run: |
          pnpm exec changeset status --output=cs.tmp.json || true
          trap 'rm -f cs.tmp.json' EXIT
          node -e "
            const fs = require('fs');
            const { execSync } = require('child_process');

            let status = { changesets: [], releases: [] };
            if (fs.existsSync('cs.tmp.json')) {
              try { status = JSON.parse(fs.readFileSync('cs.tmp.json', 'utf8')); } catch {}
            }

            const nicknames = { '@pinax/desktop': 'pinax-desktop', '@pinax/landing': 'pinax-landing' };
            const packages = [];
            const versions = {};
            const notes = {};

            for (const r of status.releases || []) {
              if (r.type === 'none') continue;
              const nick = nicknames[r.name];
              if (!nick) continue;
              const base = r.newVersion;

              let max = 0;
              try {
                const tags = execSync('git tag -l \"' + nick + '@' + base + '-rc.*\"', { encoding: 'utf8' });
                for (const line of tags.split('\n')) {
                  const match = line.match(/-rc\.(\d+)$/);
                  if (match) max = Math.max(max, Number(match[1]));
                }
              } catch {}
              const n = max + 1;
              const full = base + '-rc.' + n;

              packages.push(nick);
              versions[nick] = full;

              const summaries = (r.changesets || []).map(id => {
                const c = (status.changesets || []).find(x => x.id === id);
                return c ? '- ' + c.summary : '';
              }).filter(Boolean).join('\n');

              notes[nick] = [
                '**Bump:** ' + r.type,
                '**Package:** \`' + r.name + '\`',
                '**Version:** \`' + full + '\`',
                '',
                '### Changes',
                summaries || '_No summary provided_'
              ].join('\n');
            }

            const append = (k, v) => fs.appendFileSync(process.env.GITHUB_OUTPUT, k + '=' + v + '\n');
            append('packages', JSON.stringify(packages));
            append('versions-json', JSON.stringify(versions));
            append('notes-json', JSON.stringify(notes));
            append('has-desktop', packages.includes('pinax-desktop') ? 'true' : 'false');
            append('has-landing', packages.includes('pinax-landing') ? 'true' : 'false');
            append('desktop-matrix', JSON.stringify([
              { platform: 'linux', os: 'ubuntu-latest', arch: 'x64' },
              { platform: 'windows', os: 'windows-latest', arch: 'x64' },
              { platform: 'macos-intel', os: 'macos-26', arch: 'x64' },
              { platform: 'macos-arm64', os: 'macos-26', arch: 'arm64' }
            ]));
          "

  release:
    name: Publish release candidates
    needs: prepare
    if: needs.prepare.outputs.packages != '[]'
    uses: ./.github/workflows/publish-release.yml
    with:
      packages: ${{ needs.prepare.outputs.packages }}
      versions-json: ${{ needs.prepare.outputs.versions-json }}
      prerelease: rc
      ref: ${{ github.sha }}
      notes-json: ${{ needs.prepare.outputs.notes-json }}
      desktop-matrix: ${{ needs.prepare.outputs.desktop-matrix }}
    secrets: inherit