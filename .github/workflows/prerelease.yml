name: Prerelease

on:
  issue_comment:
    types: [created]

concurrency:
  group: prerelease-${{ github.event.issue.number }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: read
  issues: read

jobs:
  parse:
    name: Parse command and authorize
    if: github.event.issue.pull_request != ''
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.parse.outputs.ref }}
      short-sha: ${{ steps.parse.outputs.short-sha }}
      os: ${{ steps.parse.outputs.os }}
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Parse /prerelease and authorize
        id: parse
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -u

          # Read the raw comment body via the API (avoids untrusted interpolation).
          COMMENT_JSON=$(gh api "repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}")
          BODY=$(echo "$COMMENT_JSON" | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).body")

          read -r CMD OS_ARG <<< "$BODY"
          if [ "$CMD" != "/prerelease" ]; then
            echo "Not a /prerelease command - ignoring."
            exit 0
          fi
          echo "os=$OS_ARG" >> "$GITHUB_OUTPUT"

          # G2: only the PR author or maintainers may trigger a prerelease.
          PR_AUTHOR="${{ github.event.issue.user.login }}"
          COMMENT_AUTHOR="${{ github.event.comment.user.login }}"
          ASSOCIATION="${{ github.event.comment.author_association }}"
          if [ "$COMMENT_AUTHOR" = "$PR_AUTHOR" ] || [[ "$ASSOCIATION" =~ ^(OWNER|MEMBER|COLLABORATOR)$ ]]; then
            echo "Authorized: $COMMENT_AUTHOR ($ASSOCIATION)"
          else
            echo "::error::Only the PR author or repository maintainers can trigger a prerelease."
            exit 1
          fi

          # G2: PR must be open, unmerged and not a fork (fork head SHAs are not fetchable here).
          PR_JSON=$(gh api "repos/${{ github.repository }}/pulls/$PR_NUMBER")
          STATE=$(echo "$PR_JSON" | node -p "const p=JSON.parse(require('fs').readFileSync(0,'utf8')); p.state+' '+(p.merged?'true':'false')")
          if [[ "$STATE" != "open false" ]]; then
            echo "::error::Prerelease requires an open, unmerged PR."
            exit 1
          fi
          IS_FORK=$(echo "$PR_JSON" | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).head.repo.fork")
          if [ "$IS_FORK" = "true" ]; then
            echo "::error::Prerelease is not available for fork PRs."
            exit 1
          fi

          HEAD_SHA=$(echo "$PR_JSON" | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).head.sha")
          echo "ref=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "short-sha=${HEAD_SHA:0:7}" >> "$GITHUB_OUTPUT"
          echo "Ref pinned to $HEAD_SHA"

  build:
    name: Compute prerelease plan
    needs: parse
    if: needs.parse.outputs.ref != ''
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.compute.outputs.packages }}
      versions-json: ${{ steps.compute.outputs.versions-json }}
      notes-json: ${{ steps.compute.outputs.notes-json }}
      has-desktop: ${{ steps.compute.outputs.has-desktop }}
      has-landing: ${{ steps.compute.outputs.has-landing }}
      desktop-matrix: ${{ steps.compute.outputs.desktop-matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.parse.outputs.ref }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check changeset presence
        shell: bash
        run: |
          git fetch origin main:refs/remotes/origin/main || true
          CHANGESETS=$(git diff --diff-filter=ACMR --name-only "origin/main...HEAD" -- .changeset/ \
            | sed -E 's#^\.changeset/##' \
            | grep -Ev '^(config\.json|README\.md|commit\.mjs)$' || true)
          if [ -z "$CHANGESETS" ]; then
            echo "::error::No changeset found on this PR. Run 'pnpm changeset add' first."
            exit 1
          fi
          echo "Changesets detected:"
          echo "$CHANGESETS"

      - name: Compute affected packages, alpha versions and matrix
        id: compute
        env:
          SHORT_SHA: ${{ needs.parse.outputs.short-sha }}
          OS_ARG: ${{ needs.parse.outputs.os }}
        run: |
          pnpm exec changeset status --output=cs.tmp.json || true
          trap 'rm -f cs.tmp.json' EXIT
          node -e "
            const fs = require('fs');
            const { execSync } = require('child_process');

            let status = { changesets: [], releases: [] };
            if (fs.existsSync('cs.tmp.json')) {
              try { status = JSON.parse(fs.readFileSync('cs.tmp.json', 'utf8')); } catch {}
            }

            const nicknames = { '@pinax/desktop': 'pinax-desktop', '@pinax/landing': 'pinax-landing' };
            const packages = [];
            const versions = {};
            const notes = {};
            const shortSha = process.env.SHORT_SHA;

            for (const r of status.releases || []) {
              if (r.type === 'none') continue;
              const nick = nicknames[r.name];
              if (!nick) continue;
              const base = r.newVersion;

              let max = 0;
              try {
                const tags = execSync('git tag -l \"' + nick + '@' + base + '-alpha.*\"', { encoding: 'utf8' });
                for (const line of tags.split('\n')) {
                  const match = line.match(/-alpha\.(\d+)\+/);
                  if (match) max = Math.max(max, Number(match[1]));
                }
              } catch {}

              const full = base + '-alpha.' + (max + 1) + '+' + shortSha;

              packages.push(nick);
              versions[nick] = full;

              const summaries = (r.changesets || []).map(id => {
                const c = (status.changesets || []).find(x => x.id === id);
                return c ? '- ' + c.summary : '';
              }).filter(Boolean).join('\n');

              notes[nick] = [
                '**Bump:** ' + r.type,
                '**Package:** \`' + r.name + '\`',
                '**Version:** \`' + full + '\`',
                '',
                '### Changes',
                summaries || '_No summary provided_'
              ].join('\n');
            }

            // Desktop matrix scope depends on the /prerelease OS argument.
            const osArg = (process.env.OS_ARG || '').toLowerCase();
            let matrix;
            if (osArg === 'win11' || osArg === 'windows') {
              matrix = [{ platform: 'windows', os: 'windows-latest', arch: 'x64' }];
            } else if (osArg === 'linux') {
              matrix = [{ platform: 'linux', os: 'ubuntu-latest', arch: 'x64' }];
            } else if (osArg === 'mac' || osArg === 'macos' || osArg === 'darwin') {
              matrix = [
                { platform: 'macos-intel', os: 'macos-26', arch: 'x64' },
                { platform: 'macos-arm64', os: 'macos-26', arch: 'arm64' }
              ];
            } else {
              matrix = [
                { platform: 'linux', os: 'ubuntu-latest', arch: 'x64' },
                { platform: 'windows', os: 'windows-latest', arch: 'x64' },
                { platform: 'macos-intel', os: 'macos-26', arch: 'x64' },
                { platform: 'macos-arm64', os: 'macos-26', arch: 'arm64' }
              ];
            }

            const append = (k, v) => fs.appendFileSync(process.env.GITHUB_OUTPUT, k + '=' + v + '\n');
            append('packages', JSON.stringify(packages));
            append('versions-json', JSON.stringify(versions));
            append('notes-json', JSON.stringify(notes));
            append('has-desktop', packages.includes('pinax-desktop') ? 'true' : 'false');
            append('has-landing', packages.includes('pinax-landing') ? 'true' : 'false');
            append('desktop-matrix', JSON.stringify(matrix));
          "

  publish:
    name: Publish prerelease releases
    needs: [parse, build]
    if: needs.build.outputs.packages != '[]'
    uses: ./.github/workflows/publish-release.yml
    with:
      packages: ${{ needs.build.outputs.packages }}
      versions-json: ${{ needs.build.outputs.versions-json }}
      prerelease: alpha
      ref: ${{ needs.parse.outputs.ref }}
      notes-json: ${{ needs.build.outputs.notes-json }}
      desktop-matrix: ${{ needs.build.outputs.desktop-matrix }}
    secrets: inherit