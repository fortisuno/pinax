name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release-pr:
    name: Create Version Packages PR
    runs-on: ubuntu-latest
    # Transition 5/6 (G3'): skip when the push is the merge of the "Version
    # Packages" PR created by changesets/action. Merge/squash commits use the PR
    # title ("Version Packages") and rebase merges keep the action's commit
    # message ("Version Packages").
    if: |
      !startsWith(github.event.head_commit.message, 'Version Packages') &&
      !startsWith(github.event.head_commit.message, 'Release ')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create Version Packages Pull Request
        # No `title` input -> changesets/action uses its default "Version Packages".
        # The action bumps versions, updates CHANGELOGs and deletes used
        # changesets on the changeset-release/main branch, then opens/updates the
        # official release PR. Merging that PR triggers publish-official.yml.
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
