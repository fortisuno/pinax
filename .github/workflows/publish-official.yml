name: Publish Official Release

on:
  pull_request:
    types: [closed]

concurrency:
  group: official-${{ github.event.pull_request.base.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prepare:
    name: Detect released packages
    runs-on: ubuntu-latest
    # Transition 8 (G4): only the changesets "Version Packages" PR merged into main.
    if: |
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.ref == 'changeset-release/main' &&
      github.event.pull_request.title == 'Version Packages'
    outputs:
      packages: ${{ steps.compute.outputs.packages }}
      versions-json: ${{ steps.compute.outputs.versions-json }}
      notes-json: ${{ steps.compute.outputs.notes-json }}
      has-desktop: ${{ steps.compute.outputs.has-desktop }}
      has-landing: ${{ steps.compute.outputs.has-landing }}
      desktop-matrix: ${{ steps.compute.outputs.desktop-matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Compute released packages and notes
        id: compute
        run: |
          node -e "
            const fs = require('fs');
            const { execSync } = require('child_process');
            const candidates = { 'pinax-desktop': './apps/desktop', 'pinax-landing': './apps/landing' };
            const packages = [];
            const versions = {};
            const notes = {};

            for (const [pkg, dir] of Object.entries(candidates)) {
              if (!fs.existsSync(dir + '/package.json')) continue;
              const ver = JSON.parse(fs.readFileSync(dir + '/package.json', 'utf8')).version;
              const tag = pkg + '@' + ver;

              if (ver === '0.0.0') {
                console.log('Initial placeholder version for ' + pkg + ', nothing to release');
                continue;
              }
              try {
                execSync('git rev-parse -q --verify refs/tags/' + tag, { stdio: 'pipe' });
                console.log('Tag ' + tag + ' already exists, nothing to release');
                continue;
              } catch {}

              packages.push(pkg);
              versions[pkg] = ver;

              // Extract the <version> section from the package changelog (G4 notes)
              let n = 'Release ' + ver;
              try {
                const changelog = fs.readFileSync(dir + '/CHANGELOG.md', 'utf8');
                const marker = '## ' + ver;
                const start = changelog.indexOf(marker);
                if (start !== -1) {
                  const bodyStart = start + marker.length;
                  const next = changelog.indexOf('\n## ', bodyStart);
                  n = (next === -1 ? changelog.slice(bodyStart) : changelog.slice(bodyStart, next)).trim() || n;
                }
              } catch {}
              notes[pkg] = n;
            }

            const append = (k, v) => fs.appendFileSync(process.env.GITHUB_OUTPUT, k + '=' + v + '\n');
            append('packages', JSON.stringify(packages));
            append('versions-json', JSON.stringify(versions));
            append('notes-json', JSON.stringify(notes));
            append('has-desktop', packages.includes('pinax-desktop') ? 'true' : 'false');
            append('has-landing', packages.includes('pinax-landing') ? 'true' : 'false');
            append('desktop-matrix', JSON.stringify([
              { platform: 'linux', os: 'ubuntu-latest', arch: 'x64' },
              { platform: 'windows', os: 'windows-latest', arch: 'x64' },
              { platform: 'macos-intel', os: 'macos-26', arch: 'x64' },
              { platform: 'macos-arm64', os: 'macos-26', arch: 'arm64' }
            ]));
          "

  release:
    name: Publish official releases
    needs: prepare
    if: needs.prepare.outputs.packages != '[]'
    uses: ./.github/workflows/publish-release.yml
    with:
      packages: ${{ needs.prepare.outputs.packages }}
      versions-json: ${{ needs.prepare.outputs.versions-json }}
      prerelease: ""
      ref: ${{ github.event.pull_request.merge_commit_sha }}
      notes-json: ${{ needs.prepare.outputs.notes-json }}
      desktop-matrix: ${{ needs.prepare.outputs.desktop-matrix }}
    secrets: inherit