name: Trigger Prerelease

on:
  issue_comment:
    types: [created]

concurrency:
  group: prerelease-${{ github.event.issue.number }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  parse:
    name: Parse command and authorize
    if: github.event.issue.pull_request != ''
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.parse.outputs.ref }}
      short-sha: ${{ steps.parse.outputs.short-sha }}
      desktop-matrix: ${{ steps.mtx.outputs.matrix }}
      packages-hint: ${{ steps.pkgs.outputs.packages }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node + pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          cache: ""
          install: "false"
          setup-pnpm: "false"

      - name: Parse /prerelease and authorize
        id: parse
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -u

          # Read the raw comment body via the API (avoids untrusted interpolation).
          COMMENT_JSON=$(gh api "repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}")
          BODY=$(echo "$COMMENT_JSON" | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).body")

          read -r CMD OS_ARG <<< "$BODY"
          if [ "$CMD" != "/prerelease" ]; then
            echo "Not a /prerelease command - ignoring."
            exit 0
          fi

          # G2: only the PR author or maintainers may trigger a prerelease.
          PR_AUTHOR="${{ github.event.issue.user.login }}"
          COMMENT_AUTHOR="${{ github.event.comment.user.login }}"
          ASSOCIATION="${{ github.event.comment.author_association }}"
          if [ "$COMMENT_AUTHOR" = "$PR_AUTHOR" ] || [[ "$ASSOCIATION" =~ ^(OWNER|MEMBER|COLLABORATOR)$ ]]; then
            echo "Authorized: $COMMENT_AUTHOR ($ASSOCIATION)"
          else
            echo "::error::Only the PR author or repository maintainers can trigger a prerelease."
            exit 1
          fi

          # G2: PR must be open, unmerged and not a fork (fork head SHAs are not fetchable here).
          PR_JSON=$(gh api "repos/${{ github.repository }}/pulls/$PR_NUMBER")
          STATE=$(echo "$PR_JSON" | node -p "const p=JSON.parse(require('fs').readFileSync(0,'utf8')); p.state+' '+(p.merged?'true':'false')")
          if [[ "$STATE" != "open false" ]]; then
            echo "::error::Prerelease requires an open, unmerged PR."
            exit 1
          fi
          IS_FORK=$(echo "$PR_JSON" | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).head.repo.fork")
          if [ "$IS_FORK" = "true" ]; then
            echo "::error::Prerelease is not available for fork PRs."
            exit 1
          fi

          HEAD_SHA=$(echo "$PR_JSON" | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).head.sha")
          echo "ref=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "short-sha=${HEAD_SHA:0:7}" >> "$GITHUB_OUTPUT"
          echo "os-arg=$OS_ARG" >> "$GITHUB_OUTPUT"
          echo "Ref pinned to $HEAD_SHA"

      - name: React rocket to trigger comment
        if: steps.parse.outputs.ref != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMENT_ID: ${{ github.event.comment.id }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Feedback temprano: rocket en comentario trigger. Idempotente (retry-safe, G5).
          # POST crea (201) o devuelve existente (200); 422 = duplicado por carrera.
          if gh api "repos/$REPO/issues/comments/$COMMENT_ID/reactions" -f content=rocket --silent 2>react.err; then
            echo "Rocket reaction added to comment $COMMENT_ID"
            exit 0
          fi
          if grep -q -E '422|already exists|Validation Failed' react.err; then
            echo "Idempotent skip: rocket reaction already exists on comment $COMMENT_ID"
            exit 0
          fi
          cat react.err >&2
          exit 1

      - name: Resolve desktop matrix
        id: mtx
        uses: ./.github/actions/resolve-desktop-matrix
        with:
          os-arg: ${{ steps.parse.outputs.os-arg }}

      - name: Detect packages from changesets
        id: pkgs
        uses: ./.github/actions/detect-packages
        with:
          pr-number: ${{ github.event.issue.number }}
          repo: ${{ github.repository }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fallback: empty

  build:
    name: Build alpha artifacts
    needs: parse
    if: needs.parse.outputs.ref != ''
    uses: ./.github/workflows/_build-artifacts.yaml
    with:
      ref: ${{ needs.parse.outputs.ref }}
      prerelease: alpha
      short-sha: ${{ needs.parse.outputs.short-sha }}
      packages-hint: ${{ needs.parse.outputs.packages-hint }}
      desktop-matrix: ${{ needs.parse.outputs.desktop-matrix }}
    secrets: inherit

  publish:
    name: Publish alpha releases
    needs: [parse, build]
    if: needs.build.outputs.packages != '[]'
    uses: ./.github/workflows/_publish-release.yaml
    with:
      ref: ${{ needs.parse.outputs.ref }}
      packages: ${{ needs.build.outputs.packages }}
      versions-json: ${{ needs.build.outputs.versions-json }}
      notes-json: ${{ needs.build.outputs.notes-json }}
      prerelease: alpha
    secrets: inherit

  feedback:
    name: Comment prerelease feedback
    needs: [parse, build, publish]
    if: needs.build.outputs.packages != '[]'
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node + pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          cache: ""
          install: "false"
          setup-pnpm: "false"

      - name: Comment with published versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGES: ${{ needs.build.outputs.packages }}
          VERSIONS_JSON: ${{ needs.build.outputs.versions-json }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          BODY=$(node -e "
            const pkgs = JSON.parse(process.env.PACKAGES);
            const vers = JSON.parse(process.env.VERSIONS_JSON);
            const repo = process.env.REPO;
            const lines = pkgs.map(p => {
              const tag = p + '@' + vers[p];
              const url = 'https://github.com/' + repo + '/releases/tag/' + encodeURIComponent(tag);
              return '- [' + tag + '](' + url + ')';
            });
            console.log('🚀 Prereleases publicados:\n' + lines.join('\n'));
          ")
          echo "Comment body:"
          echo "$BODY"
          # Idempotency: skip if identical comment already exists (retry safety, G5 resilient)
          # NOTE: the old `gh ... --jq '.[].body' | grep -Fxq "$BODY"` never matches
          # multiline bodies (grep is line-oriented, jq quotes strings), so retries
          # duplicated the comment. Compare exact body in Node against raw API JSON.
          COMMENTS_JSON=$(gh api "repos/$REPO/issues/$PR/comments" --paginate 2>/dev/null || echo "[]")
          if printf '%s' "$COMMENTS_JSON" | BODY="$BODY" node -e "
            const fs = require('fs');
            const body = process.env.BODY || '';
            let raw = '';
            try { raw = fs.readFileSync(0, 'utf8'); } catch { raw = ''; }
            // --paginate emits one JSON array per page; parse each document.
            const docs = raw.split('\n').filter(l => l.trim().length > 0);
            let found = false;
            for (const d of docs) {
              try {
                const v = JSON.parse(d);
                const arr = Array.isArray(v) ? v : [v];
                if (arr.some(c => c && c.body === body)) { found = true; break; }
              } catch {}
            }
            process.exit(found ? 0 : 1);
          "; then
            echo "Idempotent skip: identical prerelease comment already exists"
            exit 0
          fi
          gh api "repos/$REPO/issues/$PR/comments" -f body="$BODY" >/dev/null
          echo "Feedback comment posted to PR #$PR"

