name: Trigger Official Release

on:
  pull_request:
    types: [closed]

concurrency:
  group: official-${{ github.event.pull_request.base.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prepare:
    name: Detect released packages
    runs-on: ubuntu-latest
    # Transition 8 (G4): only the changesets "Version Packages" PR merged into main.
    if: |
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.ref == 'changeset-release/main' &&
      github.event.pull_request.title == 'Version Packages'
    outputs:
      packages: ${{ steps.compute.outputs.packages }}
      ref: ${{ steps.compute.outputs.ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Compute released packages
        id: compute
        run: |
          node -e "
            const fs = require('fs');
            const { execSync } = require('child_process');
            const candidates = { 'pinax-desktop': './apps/desktop', 'pinax-landing': './apps/landing' };
            const packages = [];

            for (const [pkg, dir] of Object.entries(candidates)) {
              if (!fs.existsSync(dir + '/package.json')) continue;
              const ver = JSON.parse(fs.readFileSync(dir + '/package.json', 'utf8')).version;
              const tag = pkg + '@' + ver;

              if (ver === '0.0.0') {
                console.log('Initial placeholder version for ' + pkg + ', nothing to release');
                continue;
              }
              try {
                execSync('git rev-parse -q --verify refs/tags/' + tag, { stdio: 'pipe' });
                console.log('Tag ' + tag + ' already exists, nothing to release');
                continue;
              } catch {}

              packages.push(pkg);
            }

            const append = (k, v) => fs.appendFileSync(process.env.GITHUB_OUTPUT, k + '=' + v + '\n');
            append('packages', JSON.stringify(packages));
          "
          echo "ref=${{ github.event.pull_request.merge_commit_sha }}" >> "$GITHUB_OUTPUT"

  build:
    name: Build official artifacts
    needs: prepare
    if: needs.prepare.outputs.packages != '[]'
    uses: ./.github/workflows/_build-artifacts.yaml
    with:
      ref: ${{ needs.prepare.outputs.ref }}
      prerelease: ""
      packages-hint: ${{ needs.prepare.outputs.packages }}
      desktop-matrix: |
        [{"platform":"linux","os":"ubuntu-latest","arch":"x64"},{"platform":"windows","os":"windows-latest","arch":"x64"},{"platform":"macos-intel","os":"macos-26","arch":"x64"},{"platform":"macos-arm64","os":"macos-26","arch":"arm64"}]
    secrets: inherit

  release:
    name: Publish official releases
    needs: [prepare, build]
    if: needs.build.outputs.packages != '[]'
    uses: ./.github/workflows/_publish-release.yaml
    with:
      ref: ${{ needs.prepare.outputs.ref }}
      packages: ${{ needs.build.outputs.packages }}
      versions-json: ${{ needs.build.outputs.versions-json }}
      notes-json: ${{ needs.build.outputs.notes-json }}
      prerelease: ""
    secrets: inherit