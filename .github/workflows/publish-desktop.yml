name: Publish Desktop

on:
  pull_request:
    types: [closed]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.base.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prepare:
    name: Detect version bump
    runs-on: ubuntu-latest
    # Only run when the changesets Release PR is merged into main.
    if: |
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.ref == 'changeset-release/main' &&
      startsWith(github.event.pull_request.title, 'Release ')
    outputs:
      should-release: ${{ steps.check.outputs.should-release }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for an unreleased desktop version
        id: check
        run: |
          VERSION=$(node -p "require('./apps/desktop/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "$VERSION" = "0.0.0" ]; then
            echo "Initial placeholder version, nothing to release"
            echo "should-release=false" >> "$GITHUB_OUTPUT"
          elif git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "Tag v$VERSION already exists, nothing to release"
            echo "should-release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Desktop bumped to $VERSION, creating release"
            echo "should-release=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build installers (${{ matrix.platform }})
    needs: prepare
    if: needs.prepare.outputs.should-release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
            arch: x64
          - platform: windows
            os: windows-latest
            arch: x64
          - platform: macos-intel
            os: macos-latest
            arch: x64
          - platform: macos-arm64
            os: [self-hosted, macOS, ARM64]
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Clean previous release outputs
        # Self-hosted runners (macos-arm64) persist the workspace between runs
        # and release/ is gitignored, so stale/corrupt DMGs from earlier runs
        # would otherwise be picked up by the upload step below.
        shell: bash
        run: rm -rf release

      - name: Build installers
        shell: bash
        run: |
          # GitHub passes missing secrets as empty strings. electron-builder
          # treats an empty CSC_LINK as a file path and fails
          # ("Env WIN_CSC_LINK is not correct, cannot resolve ... not a file",
          # seen on windows). Unset empties so no-cert builds behave as before
          # (unsigned/ad-hoc fallback).
          for v in CSC_LINK CSC_KEY_PASSWORD WIN_CSC_LINK WIN_CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER; do
            if [ -z "${!v:-}" ]; then unset "$v"; fi
          done
          # NOTE: do NOT pass arch flags through the `build` script
          # (pnpm appends them after `--`, yargs ignores them, and then ONE job
          # builds BOTH archs concurrently — sharing a /Volumes mount point and
          # corrupting the DMGs). Compile via `dist`, then invoke
          # electron-builder directly so each matrix job builds only its arch.
          if [ "${{ matrix.platform }}" = "macos-intel" ]; then
            pnpm --filter @pinax/desktop dist
            pnpm --filter @pinax/desktop exec electron-builder --mac --x64
          elif [ "${{ matrix.platform }}" = "macos-arm64" ]; then
            pnpm --filter @pinax/desktop dist
            pnpm --filter @pinax/desktop exec electron-builder --mac --arm64
          else
            pnpm --filter @pinax/desktop build
          fi
        env:
          # Real Developer ID signing + notarization is opt-in: set these repo
          # secrets and the mac build will be signed, notarized and stapled,
          # which is the ONLY way to remove the Gatekeeper
          # "Apple could not verify ... free of malware" dialog.
          # Without them the build falls back to ad-hoc signing
          # (scripts/adhoc-sign.cjs) and Gatekeeper will still warn on
          # downloaded DMGs — expected macOS behavior, not a build bug.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.CSC_LINK == '' && 'false' || 'true' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

      - name: Verify macOS signature (mac only)
        if: startsWith(matrix.platform, 'macos-')
        shell: bash
        run: |
          set -u
          OUT="release/${{ needs.prepare.outputs.version }}"
          echo "== DMG integrity (fail-closed: a corrupt DMG must not be released) =="
          shopt -s nullglob
          DMGS=("$OUT"/*.dmg)
          if [ "${#DMGS[@]}" -eq 0 ]; then
            echo "ERROR: no .dmg produced in $OUT"
            ls -la "$OUT" || true
            exit 1
          fi
          for DMG in "${DMGS[@]}"; do
            echo "--- $DMG"
            du -h "$DMG"
            shasum -a 256 "$DMG"
            hdiutil verify "$DMG"
            # Informational only: ad-hoc builds are NOT expected to pass assessment.
            spctl -a -vvv --type install "$DMG" || true
          done
          echo "== .app signature (informational for ad-hoc builds) =="
          APP=$(find "$OUT" -maxdepth 3 -name "*.app" | head -n 1)
          if [ -z "$APP" ]; then
            echo "No .app bundle left in output dir (only DMG/ZIP published)."
            exit 0
          fi
          echo "APP=$APP"
          codesign --verify --deep --strict --verbose=2 "$APP" || true
          # "accepted / Notarized Developer ID" = Gatekeeper clean.
          # "Unnotarized / ad-hoc" = Gatekeeper WILL warn on download — see env docs above.
          spctl --assess --verbose --type exec "$APP" || true
          xcrun stapler validate "$APP" || true

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.platform }}
          path: |
            release/${{ needs.prepare.outputs.version }}/pinax-*.AppImage
            release/${{ needs.prepare.outputs.version }}/pinax-*.zip
            release/${{ needs.prepare.outputs.version }}/pinax-*.dmg
            release/${{ needs.prepare.outputs.version }}/pinax-*-Setup.exe
          if-no-files-found: error

  publish:
    name: Create GitHub Release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: artifacts
          merge-multiple: true

      - name: Extract release notes from changelog
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          node -e "
            const fs = require('fs');
            const version = process.env.RELEASE_VERSION;
            let notes = 'Release ' + version;
            try {
              const changelog = fs.readFileSync('apps/desktop/CHANGELOG.md', 'utf8');
              const marker = '## ' + version;
              const start = changelog.indexOf(marker);
              if (start !== -1) {
                const bodyStart = start + marker.length;
                const next = changelog.indexOf('\n## ', bodyStart);
                const section = (next === -1 ? changelog.slice(bodyStart) : changelog.slice(bodyStart, next)).trim();
                if (section) notes = section;
              }
            } catch {}
            fs.writeFileSync('release-notes.md', notes);
          "

      - name: Flatten installers
        run: |
          mkdir -p installers
          find artifacts -type f -exec mv {} installers/ \;
          find artifacts -mindepth 1 -type d -empty -delete

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          gh release create "v$RELEASE_VERSION" \
            --title "$RELEASE_VERSION" \
            --notes-file release-notes.md \
            installers/*
